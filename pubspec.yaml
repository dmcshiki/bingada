name: tokingo
description: Bingo web multijogador, open source e auditável.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  cloud_firestore: ^7.1.0
  confetti: ^0.8.0
  crypto: ^3.0.8
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  firebase_database: ^13.0.1
  fixnum: ^1.1.1
  flutter:
    sdk: flutter
  freezed_annotation: ^3.1.0
  get_it: ^9.3.0
  go_router: ^18.1.3
  google_fonts: ^9.0.0
  google_sign_in: ^7.2.0
  json_annotation: ^4.12.0
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.6
  web: ^1.1.2

  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

dev_dependencies:
  build_runner: ^2.17.1
  flutter_test:
    sdk: flutter
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
