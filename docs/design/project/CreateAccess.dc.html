<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Tokingo – criar sala: acesso</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Days+One&amp;family=Montserrat:wght@300;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#204a77}a:hover{color:#1868a1}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; background: #e6e9e9; font-family: Montserrat, sans-serif; color: #424041; display: flex; flex-direction: column; position: relative; overflow: hidden">
  <div style="position: absolute; right: -180px; bottom: -240px; width: 520px; height: 520px; background: #779ccf; border-radius: 130px; transform: rotate(-8deg)" aria-hidden="true"></div>
  <header style="position: relative; height: 72px; display: flex; align-items: center; gap: 32px; padding: 0 40px">
    <span style="font-family: 'Days One', sans-serif; font-size: 26px; color: #204a77">tokingo</span>
    <nav style="display: flex; gap: 8px; font-size: 14px; font-weight: 700" aria-label="Etapas">
      <span style="padding: 8px 14px; border-radius: 16px; background: #204a77; color: #ffffff">1 Acesso</span>
      <span style="padding: 8px 14px; border-radius: 16px; background: #ffffff">2 Cartela</span>
      <span style="padding: 8px 14px; border-radius: 16px; background: #ffffff">3 Prêmios</span>
      <span style="padding: 8px 14px; border-radius: 16px; background: #ffffff">4 Regras</span>
    </nav>
  </header>
  <main style="position: relative; flex: 1; padding: 16px 40px 32px; display: flex">
    <section style="flex: 1; background: #ffffff; border-radius: 28px; padding: 32px; display: flex; flex-direction: column; gap: 20px">
      <h1 style="margin: 0; font-weight: 300; font-size: 30px">quem pode <b style="font-weight: 700">entrar?</b></h1>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; max-width: 560px">Nome do evento
        <input value="Happy hour de sexta" style="height: 48px; border-radius: 14px; border: 2px solid #e6e9e9; padding: 0 14px; font-family: Montserrat, sans-serif; font-size: 16px">
      </label>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px">
        <sc-for list="{{modes}}" as="m" hint-placeholder-count="4">
          <button style="text-align: left; border-radius: 22px; border: {{m.border}}; background: {{m.bg}}; padding: 20px; display: flex; flex-direction: column; gap: 8px; cursor: pointer; font-family: Montserrat, sans-serif; color: #424041; min-height: 150px" onClick="{{m.pick}}" aria-pressed="{{m.on}}">
            <span style="font-family: 'Days One', sans-serif; font-size: 18px; color: #204a77">{{m.t}}</span>
            <span style="font-size: 14px; line-height: 1.4">{{m.d}}</span>
          </button>
        </sc-for>
      </div>
      <div style="background: #f4f6f6; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 10px; max-width: 760px">
        <span style="font-size: 13px; font-weight: 700">{{cfgLabel}}</span>
        <sc-if value="{{showInput}}" hint-placeholder-val="{{true}}">
          <input value="{{cfgValue}}" aria-label="{{cfgLabel}}" style="height: 48px; border-radius: 14px; border: 2px solid #e6e9e9; padding: 0 14px; font-family: Montserrat, sans-serif; font-size: 16px; background: #ffffff">
        </sc-if>
        <span style="font-size: 13px">{{cfgHelp}}</span>
      </div>
      <div style="flex: 1"></div>
      <div style="display: flex; justify-content: space-between; align-items: center">
        <span style="font-size: 13px">A regra de acesso fica travada quando o jogo começa.</span>
        <div style="display: flex; gap: 12px">
          <button style="height: 52px; padding: 0 22px; border-radius: 16px; border: 2px solid #424041; background: #ffffff; color: #424041; font-family: Montserrat, sans-serif; font-weight: 700; font-size: 15px">Cancelar</button>
          <button style="height: 52px; padding: 0 26px; border-radius: 16px; border: 0; background: #204a77; color: #ffffff; font-family: Montserrat, sans-serif; font-weight: 700; font-size: 15px">Próximo: cartela</button>
        </div>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { m: 0 }; }
  renderVals() {
    var self = this;
    var defs = [
      { t: 'Domínio', d: 'Só e-mails dos domínios que você listar.', l: 'Domínios aceitos', v: 'suaempresa.com.br', h: 'Separe vários com vírgula.', inp: true },
      { t: 'Mesmo que o meu', d: 'Só quem tem o mesmo domínio do seu e-mail.', l: 'Domínio detectado', v: 'suaempresa.com.br', h: 'Vem da sua conta, não dá para editar.', inp: true },
      { t: 'Lista de e-mails', d: 'Só convidados específicos (até 60).', l: 'E-mails convidados', v: 'ana@..., joao@..., marina@...', h: 'Cole uma lista. 3 de 60 usados.', inp: true },
      { t: 'Pública', d: 'Qualquer conta Google verificada.', l: 'Atenção', v: '', h: 'Qualquer pessoa com o código pode entrar. Uma pessoa com várias contas pode ter várias cartelas.', inp: false }
    ];
    var cur = this.state.m;
    var modes = defs.map(function (d, i) { var on = i === cur; return { t: d.t, d: d.d, on: on ? 'true' : 'false',
      bg: on ? '#eef3fa' : '#ffffff', border: on ? '3px solid #204a77' : '2px solid #e6e9e9',
      pick: function () { self.setState({ m: i }); } }; });
    var d = defs[cur];
    return { modes: modes, cfgLabel: d.l, cfgValue: d.v, cfgHelp: d.h, showInput: d.inp };
  }
}
</script>
</body>
</html>
