<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Tokingo – criar sala: regras e revisão</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Days+One&amp;family=Montserrat:wght@300;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#204a77}a:hover{color:#1868a1}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; background: #e6e9e9; font-family: Montserrat, sans-serif; color: #424041; display: flex; flex-direction: column">
  <header style="height: 72px; display: flex; align-items: center; gap: 32px; padding: 0 40px">
    <span style="font-family: 'Days One', sans-serif; font-size: 26px; color: #204a77">tokingo</span>
    <nav style="display: flex; gap: 8px; font-size: 14px; font-weight: 700" aria-label="Etapas">
      <span style="padding: 8px 14px; border-radius: 16px; background: #ffffff">1 Acesso ✓</span>
      <span style="padding: 8px 14px; border-radius: 16px; background: #ffffff">2 Cartela ✓</span>
      <span style="padding: 8px 14px; border-radius: 16px; background: #ffffff">3 Prêmios ✓</span>
      <span style="padding: 8px 14px; border-radius: 16px; background: #204a77; color: #ffffff">4 Regras</span>
    </nav>
  </header>
  <main style="flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 520px; gap: 28px; padding: 16px 40px 32px">
    <section style="background: #ffffff; border-radius: 28px; padding: 28px; display: flex; flex-direction: column; gap: 18px">
      <h1 style="margin: 0; font-weight: 300; font-size: 30px"><b style="font-weight: 700">regras</b> da casa</h1>
      <sc-for list="{{rules}}" as="r" hint-placeholder-count="4">
        <div style="display: flex; align-items: center; gap: 18px; padding: 16px 18px; background: #f4f6f6; border-radius: 18px">
          <div style="flex: 1; display: flex; flex-direction: column; gap: 4px">
            <span style="font-weight: 700; font-size: 16px">{{r.t}}</span>
            <span style="font-size: 13px">{{r.d}}</span>
          </div>
          <span style="padding: 10px 14px; border-radius: 14px; background: #ffffff; border: 2px solid #e6e9e9; font-weight: 700; font-size: 14px; min-width: 120px; text-align: center">{{r.v}}</span>
        </div>
      </sc-for>
      <div style="flex: 1"></div>
      <div style="display: flex; justify-content: flex-end; gap: 12px">
        <button style="height: 52px; padding: 0 22px; border-radius: 16px; border: 2px solid #424041; background: #ffffff; color: #424041; font-family: Montserrat, sans-serif; font-weight: 700; font-size: 15px">Voltar</button>
        <button style="height: 52px; padding: 0 30px; border-radius: 16px; border: 0; background: #204a77; color: #ffffff; font-family: Montserrat, sans-serif; font-weight: 700; font-size: 15px">Criar sala e abrir espera</button>
      </div>
    </section>
    <section style="background: #204a77; color: #ffffff; border-radius: 28px; padding: 28px; display: flex; flex-direction: column; gap: 14px">
      <span style="font-weight: 300; font-size: 24px">revisão <b style="font-weight: 700">final</b></span>
      <sc-for list="{{summary}}" as="s" hint-placeholder-count="5">
        <div style="display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; background: rgba(255,255,255,.10); border-radius: 16px">
          <span style="font-size: 12px; font-weight: 700; letter-spacing: .05em">{{s.k}}</span>
          <span style="font-size: 15px; line-height: 1.4">{{s.v}}</span>
        </div>
      </sc-for>
      <span style="font-size: 13px; line-height: 1.5">Ao criar, geramos o salt da sala e publicamos o commit do sorteio. Acesso, cartela e prêmios ficam travados quando você começar o jogo.</span>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      rules: [
        { t: 'Host também joga', d: 'Você recebe uma cartela e ocupa 1 das 60 vagas.', v: 'Sim' },
        { t: 'Penalidade por comer bola', d: 'Por enquanto o grito errado só não vale e o jogo segue.', v: 'Nenhuma' },
        { t: 'Mostrar “comeu bola” na transmissão', d: 'A vergonha pública opcional.', v: 'Mostrar' },
        { t: 'Empate no mesmo prêmio', d: 'Dois ou mais gritos válidos na mesma bola.', v: 'Sorteio de desempate' },
        { t: 'Desempate do azarão', d: 'Mais de um jogador com o mesmo mínimo.', v: 'Sorteio de desempate' }
      ],
      summary: [
        { k: 'EVENTO', v: 'Happy hour de sexta · até 60 jogadores' },
        { k: 'ACESSO', v: 'Domínio: suaempresa.com.br' },
        { k: 'CARTELA', v: 'Clássico 75 · 5×5 · centro livre ★ · colunas B I N G O' },
        { k: 'PRÊMIOS', v: '1 Caneca (Horizontal) → 2 Vale-café (Vertical) → 3 Fone (Cartela cheia, encerra o jogo)' },
        { k: 'FIM DE JOGO', v: 'Prêmio azarão' }
      ]
    };
  }
}
</script>
</body>
</html>
