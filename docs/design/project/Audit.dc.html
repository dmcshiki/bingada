<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Tokingo – auditoria pública</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Days+One&amp;family=Montserrat:wght@300;500;700&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap">
<style>
body{margin:0}
a{color:#204a77}a:hover{color:#1868a1}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; background: #e6e9e9; font-family: Montserrat, sans-serif; color: #424041; display: flex; flex-direction: column">
  <header style="height: 72px; display: flex; align-items: center; justify-content: space-between; padding: 0 40px">
    <div style="display: flex; align-items: center; gap: 24px">
      <span style="font-family: 'Days One', sans-serif; font-size: 26px; color: #204a77">tokingo</span>
      <span style="font-weight: 300; font-size: 16px">auditoria <b style="font-weight: 700">pública</b> · jogo <span style="font-family: 'JetBrains Mono', monospace">g_8f2c…a91</span></span>
    </div>
    <span style="font-size: 13px">build <span style="font-family: 'JetBrains Mono', monospace">a1b2c3d</span> · código no GitHub ↗</span>
  </header>
  <main style="flex: 1; display: grid; grid-template-columns: 460px minmax(0, 1fr); gap: 24px; padding: 16px 40px 32px">
    <section style="background: #2e8a3e; color: #ffffff; border-radius: 28px; padding: 32px; display: flex; flex-direction: column; gap: 18px">
      <div style="width: 140px; height: 140px; border-radius: 36px; transform: rotate(-8deg); background: #ffffff; color: #2e8a3e; display: flex; align-items: center; justify-content: center; font-family: 'Days One', sans-serif; font-size: 72px">✓</div>
      <span style="font-family: 'Days One', sans-serif; font-size: 32px; line-height: 1.15">Partida 100% verificada</span>
      <span style="font-size: 15px; line-height: 1.5">Tudo foi recalculado agora, no seu navegador, com o mesmo código aberto que rodou na partida. Nada depende de confiar no host.</span>
      <div style="flex: 1"></div>
      <button style="height: 52px; border-radius: 16px; border: 2px solid #ffffff; background: transparent; color: #ffffff; font-family: Montserrat, sans-serif; font-weight: 700; font-size: 15px">Baixar dados da partida (JSON)</button>
    </section>
    <section style="background: #ffffff; border-radius: 28px; padding: 28px; display: flex; flex-direction: column; gap: 12px">
      <h2 style="margin: 0 0 6px; font-weight: 300; font-size: 24px">o que foi <b style="font-weight: 700">conferido</b></h2>
      <sc-for list="{{checks}}" as="c" hint-placeholder-count="7">
        <div style="display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px 16px; background: #f4f6f6; border-radius: 16px">
          <span style="width: 32px; height: 32px; border-radius: 10px; background: #4ec45f; color: #123b19; display: flex; align-items: center; justify-content: center; font-weight: 700">✓</span>
          <div style="display: flex; flex-direction: column; gap: 3px">
            <span style="font-weight: 700; font-size: 15px">{{c.t}}</span>
            <span style="font-size: 12px; font-family: 'JetBrains Mono', monospace; color: #5a5859">{{c.d}}</span>
          </div>
          <span style="font-size: 13px; font-weight: 700; color: #2e7d3a">{{c.r}}</span>
        </div>
      </sc-for>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { checks: [
      { t: 'Commit do sorteio bate com a seed revelada', d: 'sha256(drawSeed) = 9f3a…c21e', r: 'ok' },
      { t: 'Seed final fixada no início', d: 'sha256(drawSeed | hash(42 cartelas))', r: 'ok' },
      { t: 'Sequência das 61 bolas confere', d: 'permutação mulberry32(finalSeed)', r: '61/61' },
      { t: 'Cartelas geradas corretamente', d: 'gerar(uid, gameId, salt, template)', r: '42/42' },
      { t: 'Vereditos dos gritos', d: '2 válidos · 1 comeu bola · 1 modalidade errada', r: '4/4' },
      { t: 'Ordem e modalidade dos prêmios', d: 'Horizontal → Vertical → Cartela cheia', r: 'ok' },
      { t: 'Azarão calculado no encerramento', d: 'mín. de números sorteados: Lucas F. (9/24)', r: 'ok' }
    ] };
  }
}
</script>
</body>
</html>
